<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal de Documentos · Combuses</title>
<meta name="theme-color" content="#0078d4" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.svg" />
<link rel="apple-touch-icon" href="icons/icon-192.svg" />
<link rel="stylesheet" href="css/styles.css?v=1.5.0" />
</head>
<body>

<div id="authPanel" class="auth-panel">
  <div class="auth-card">
    <div class="auth-logo">🚌</div>
    <h1>Portal de Documentos</h1>
    <p class="auth-sub">Combuses · Coordinación de ruta</p>
    <form id="authForm">
      <label>Usuario
        <input type="email" id="authEmail" placeholder="tu.ruta@combuses.com.co" autocomplete="username" required />
      </label>
      <label>Contraseña
        <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Ingresar</button>
      <div id="authStatus" class="auth-status"></div>
    </form>
  </div>
</div>

<div id="appWrap" class="app-wrap hidden">
  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-logo">🚌</span>
      <div>
        <div class="topbar-h1">Portal de Documentos</div>
        <div class="topbar-sub" id="rutaLabel">—</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="app-version" id="appVersion" title="Toca para buscar actualización">—</span>
      <button class="btn btn-ghost btn-sm" id="btnRefresh" title="Actualizar">⟳ Actualizar</button>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
    </div>
  </header>

  <main class="main">
    <div class="summary-bar" id="summaryBar"></div>

    <nav class="section-tabs">
      <button class="section-tab active" data-section="vehiculos">Vehículos</button>
      <button class="section-tab" data-section="conductores">Conductores</button>
      <button class="section-tab" data-section="escaneo">📷 Escaneo de tarjetas</button>
    </nav>

    <section id="secVehiculos" class="section">
      <div id="alertaPreventivo" class="alert-panel hidden">
        <div class="alert-panel-head">🔧 Próximas bimensuales (Mantenimiento Preventivo)</div>
        <div id="alertaPreventivoBody" class="alert-list"></div>
      </div>

      <div class="section-toolbar">
        <input type="search" id="buscarVehiculo" placeholder="Buscar por placa o interno…" />
      </div>
      <div id="vehiculosGrid" class="cards-grid"></div>
    </section>

    <section id="secConductores" class="section hidden">
      <div class="section-toolbar">
        <input type="search" id="buscarConductor" placeholder="Buscar por nombre o cédula…" />
      </div>
      <div id="conductoresGrid" class="cards-grid"></div>
    </section>

    <section id="secEscaneo" class="section hidden">
      <div class="scan-toolbar">
        <label class="scan-fecha-label">Día
          <input type="date" id="fechaEscaneo" />
        </label>
        <label class="btn btn-primary scan-btn-camara">
          📷 Escanear tarjeta
          <input type="file" id="inputEscanear" accept="image/*" capture="environment" />
        </label>
        <button class="btn btn-ghost" id="btnElegirGaleria">🖼 Elegir de galería</button>
        <input type="file" id="inputEscanearGaleria" accept="image/*" multiple class="hidden" />
        <button class="btn btn-primary" id="btnGenerarPdf">📄 Generar PDF del día</button>
      </div>
      <div class="muted scan-hint">Las fotos de las tarjetas de despacho de este día se guardan aquí. Cuando termines el turno, genera el PDF con todas juntas.</div>
      <div id="escaneosGrid" class="scan-grid"></div>
    </section>
  </main>
</div>

<div id="docModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="docModalTitle">Documentos</h3>
      <button class="modal-close" id="docModalClose">✕</button>
    </div>
    <div id="docModalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="js/app.js?v=1.5.0"></script>
<script src="js/pwa.js?v=1.5.0"></script>
</body>
</html>
