<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal de Documentos · Combuses</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230078d4'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle' fill='white' font-family='Arial'%3EP%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css?v=1.0.1" />
</head>
<body>

<div id="authPanel" class="auth-panel">
  <div class="auth-card">
    <div class="auth-logo">🚌</div>
    <h1>Portal de Documentos</h1>
    <p class="auth-sub">Combuses · Coordinación de ruta</p>
    <form id="authForm">
      <label>Usuario
        <input type="email" id="authEmail" placeholder="tu.ruta@combuses.com.co" autocomplete="username" required />
      </label>
      <label>Contraseña
        <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Ingresar</button>
      <div id="authStatus" class="auth-status"></div>
    </form>
  </div>
</div>

<div id="appWrap" class="app-wrap hidden">
  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-logo">🚌</span>
      <div>
        <div class="topbar-h1">Portal de Documentos</div>
        <div class="topbar-sub" id="rutaLabel">—</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="btnRefresh" title="Actualizar">⟳ Actualizar</button>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
    </div>
  </header>

  <main class="main">
    <div class="summary-bar" id="summaryBar"></div>

    <nav class="section-tabs">
      <button class="section-tab active" data-section="vehiculos">Vehículos</button>
      <button class="section-tab" data-section="conductores">Conductores</button>
    </nav>

    <section id="secVehiculos" class="section">
      <div class="section-toolbar">
        <input type="search" id="buscarVehiculo" placeholder="Buscar por placa o interno…" />
      </div>
      <div id="vehiculosGrid" class="cards-grid"></div>
    </section>

    <section id="secConductores" class="section hidden">
      <div class="section-toolbar">
        <input type="search" id="buscarConductor" placeholder="Buscar por nombre o cédula…" />
      </div>
      <div id="conductoresGrid" class="cards-grid"></div>
    </section>
  </main>
</div>

<div id="docModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="docModalTitle">Documentos</h3>
      <button class="modal-close" id="docModalClose">✕</button>
    </div>
    <div id="docModalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=1.0.1"></script>
</body>
</html>
